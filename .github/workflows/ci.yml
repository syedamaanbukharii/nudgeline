name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: uv sync
      
    - name: Lint
      run: |
        uv run ruff check .
        uv run ruff format --check .
        
    - name: Typecheck
      run: uv run mypy apps modules services
      
    - name: Docker Build
      run: docker compose build
