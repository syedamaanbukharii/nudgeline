[project]
name = "nudgeline"
version = "0.1.0"
description = "Call-workflow engine backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "orjson==3.13.0",
    "phonenumbers==9.0.41",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "livekit==1.1.20",
    "livekit-api==1.2.1",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "import-linter==2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TC"]
# SQLAlchemy and pydantic resolve annotations at runtime, so typing-only import moves are unsafe here.
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "modules", "services"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["apps", "modules", "services"]
