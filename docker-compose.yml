# Profiles:
#   dev    everything with the simulated phone line and the light "tone" TTS
#   voice  adds LiveKit server + SIP for real calls (use with pilot/prod settings)
#   prod   same services as dev; configure via .env / Docker secrets
x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://nudgeline_app:${APP_DB_PASSWORD:-nudgeline_app}@postgres:5432/${POSTGRES_DB:-nudgeline}
  DATABASE_URL_SYSTEM: postgresql+asyncpg://${POSTGRES_USER:-nudgeline}:${POSTGRES_PASSWORD:-nudgeline}@postgres:5432/${POSTGRES_DB:-nudgeline}
  SPEECH_URL: http://speech:8000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nudgeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nudgeline}
      POSTGRES_DB: ${POSTGRES_DB:-nudgeline}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-nudgeline_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nudgeline} -d ${POSTGRES_DB:-nudgeline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["dev", "prod", "voice"]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    profiles: ["dev", "prod", "voice"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["dev", "prod", "voice"]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["python", "-m", "apps.worker.main"]
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["dev", "prod", "voice"]

  speech:
    build:
      context: .
      dockerfile: services/speech/Dockerfile
      args:
        WITH_MODELS: ${SPEECH_WITH_MODELS:-false}
    restart: unless-stopped
    environment:
      TTS_BACKEND: ${TTS_BACKEND:-tone}
      STT_BACKEND: ${STT_BACKEND:-none}
      DEVICE: ${SPEECH_DEVICE:-cpu}
    volumes:
      - speech_models:/models
    profiles: ["dev", "prod", "voice"]

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Nudgeline}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    profiles: ["dev", "prod", "voice"]

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    profiles: ["dev", "prod", "voice"]

  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    command: --config /livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-}"
    depends_on: [redis]
    volumes:
      - ./infra/livekit/livekit.yaml:/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    profiles: ["voice"]

  livekit-sip:
    image: livekit/sip:v1.18.0
    restart: unless-stopped
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    depends_on: [livekit, redis]
    profiles: ["voice"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["voice"]

volumes:
  postgres_data:
  speech_models:
