worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    upstream api_up {
        least_conn;
        server api:8000;
        keepalive 64;
    }

    upstream web_up {
        server web:3000;
        keepalive 32;
    }

    upstream kc_up {
        server keycloak:8080;
    }

    upstream lk_up {
        server livekit:7880;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/local.pem;
        ssl_certificate_key /etc/nginx/certs/local-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE endpoint: no buffering, long timeout
        location /v1/stream {
            proxy_pass http://api_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Inbound webhooks (carrier, Google, Microsoft, CRM)
        location /hooks/ {
            proxy_pass http://api_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API routes
        location /api/ {
            limit_req zone=perip burst=40 nodelay;
            proxy_pass http://api_up/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health check passthrough
        location /healthz {
            proxy_pass http://api_up;
        }

        # Keycloak auth
        location /auth/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://kc_up;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LiveKit signaling (WebSocket)
        location /rtc/ {
            proxy_pass http://lk_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://web_up;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Web app (catch-all)
        location / {
            proxy_pass http://web_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
