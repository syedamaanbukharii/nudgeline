worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream api_up { server api:8000; keepalive 32; }
    upstream web_up { server web:3000; keepalive 16; }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/local.pem;
        ssl_certificate_key /etc/nginx/certs/local-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sign-in and sign-up are rate limited per IP.
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_up;
        }

        # API (webhooks included). The /api prefix is stripped.
        location /api/ {
            limit_req zone=perip burst=60 nodelay;
            proxy_pass http://api_up/;
        }

        location /_next/static/ {
            proxy_pass http://web_up;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://web_up;
        }
    }
}
